# Preserva os dados; esquema 2 é migrado com backup pre-v3, sem converter claims antigos.
claims:
  solo-limit: 9
  group-per-member: 9
groups:
  name-min: 3
  name-max: 32
raid:
  duration-seconds: 300
  block-limit: 30
  owner-cooldown-hours: 12
  defense-cooldown-hours: 24
  invader-cooldown-hours: 2
  owner-offline-seconds: 60
notices:
  debounce-ticks: 20
visual:
  particle: HAPPY_VILLAGER
  interval-ticks: 20
  particles-per-corner: 2

claim-bonus:
  enabled: true
  max-per-member: 6
  pvp:
    enabled: true
intel-book:
  enabled: true
  drop-chance: 0.25
  include-normal-claims: true
  include-bonus-claims: true
  include-personal-claims: false
discordsrv:
  enabled: true
  announce-war: true
  announce-peace: true
  # Vazio usa o canal principal de chat já mapeado pelo DiscordSRV.
  channel: ""
logs:
  # Somente logs/territorio-AAAA-MM-DD.log antigos entram nesta retenção.
  retention-days: 30
